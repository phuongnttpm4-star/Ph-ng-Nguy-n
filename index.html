  <style>
    /* CSS 3D Perspective & Flip Animations */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }

    /* Card Front Design: Traditional Trúc Xanh green gradient with golden highlights & bevel */
    .card-front-design {
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 50%, #15803d 100%);
      border: 2px solid #881337;
      box-shadow: 
        inset 0 2px 4px rgba(254, 240, 138, 0.8),
        inset 0 -3px 6px rgba(15, 23, 42, 0.6),
        0 6px 12px rgba(0, 0, 0, 0.4);
    }

    /* Card Number Typography */
    .card-number-text {
      color: #881337;
      text-shadow: 
        0 2px 0 rgba(255, 255, 255, 0.8),
        0 -1px 0 rgba(0, 0, 0, 0.3),
        0 4px 10px rgba(0, 0, 0, 0.4);
      font-family: 'Playfair Display', Georgia, serif;
    }

    /* Card Back Glassmorphism Style */
    .card-back-glass {
      background: rgba(10, 25, 47, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    /* Shake Error Animation */
    @keyframes shakeError {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      20%, 60% { transform: rotateY(180deg) translateX(-8px); }
      40%, 80% { transform: rotateY(180deg) translateX(8px); }
    }
    .animate-shake {
      animation: shakeError 0.4s ease-in-out;
      border-color: #ef4444 !important;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.9) !important;
    }

    /* Green Glow Success Animation */
    @keyframes glowSuccess {
      0%, 100% { box-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
      50% { box-shadow: 0 0 30px rgba(34, 197, 94, 1); border-color: #4ade80 !important; }
    }
    .animate-success-glow {
      animation: glowSuccess 0.8s ease-in-out;
    }

    /* Card Disappear when matched */
    .card-matched-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: scale(0.92);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    /* Custom Scrollbar & Touch Optimizations */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.3);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.6);
    }
  </style>

  <script>

          {
            "left": "Hạt không mang điện, nằm trong hạt nhân nguyên tử ($n$)",

          {

          },
          {
            "left": "Tập hợp các hạt nằm trong hạt nhân nguyên tử gồm",
            "right": "Proton và Neutron (trừ $^1H$)"
          },
          {
            "left": "Kích thước hạt nhân so với kích thước nguyên tử như thế nào?",
            "right": "Vô cùng nhỏ (nhỏ hơn khoảng $10^4 - 10^5$ lần)"
          },
          {
            "left": "Hạt nào trong nguyên tử có khối lượng xấp xỉ $1\\text{ amu}$?",
            "right": "Proton và Neutron"
          },
          {
            "left": "Khối lượng của hạt nào rất nhỏ, xấp xỉ $0{,}00055\\text{ amu}$?",
            "right": "Electron"
          },
          // Mức độ Thông hiểu
          {
            "left": "Đại lượng $A$ bằng tổng số proton ($Z$) và số neutron ($N$) gọi là",

          },
          {
            "left": "Vì sao nguyên tử luôn trung hòa về điện?",

          {
            "left": "Điện tích hạt nhân nguyên tử được tính bằng công thức nào?",
            "right": "$+Z$ (với $Z$ là số hiệu nguyên tử)"
          },
          {
            "left": "Đại lượng đặc trưng nhất cho một nguyên tố hoá học là",
            "right": "Số hiệu nguyên tử ($Z$)"
          },
          {
            "left": "Khối lượng nguyên tử tập trung chủ yếu ở đâu?",
            "right": "Hạt nhân nguyên tử (do $m_e$ rất nhỏ)"
          },
          {
            "left": "Nếu nguyên tử Sodium có $11p$ thì số electron ở lớp vỏ là",
            "right": "11 electron"
          },
          {
            "left": "Số hiệu nguyên tử ($Z$) của một nguyên tố bằng giá trị nào?",
            "right": "Số đơn vị điện tích hạt nhân ($Z = p = e$)"
          },
          // Mức độ Vận dụng thấp

    // Web Audio API Context
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    /**
     * PHÁT ÂM THANH TRỰC TIẾP QUA WEB AUDIO API SYNTH
     */
    function playSound(type) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;

      if (type === 'flip') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(850, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);

      } else if (type === 'match') {
        const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        freqs.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const startTime = now + idx * 0.08;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.35);
        });

      } else if (type === 'wrong') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.25);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);

      } else if (type === 'victory') {
        const notes = [
          { f: 523.25, d: 0.12, t: 0 },
          { f: 659.25, d: 0.12, t: 0.12 },
          { f: 783.99, d: 0.12, t: 0.24 },
          { f: 1046.50, d: 0.4, t: 0.36 },
          { f: 880.00, d: 0.15, t: 0.8 },
          { f: 1046.50, d: 0.6, t: 0.98 }
        ];
        notes.forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const startTime = now + note.t;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.f, startTime);
          gain.gain.setValueAtTime(0.25, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.d);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + note.d);
        });
      }
    }

    function selectLesson(lessonNum) {

          btn.className = "lesson-btn px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all border border-cyan-500/40 bg-gradient-to-r from-cyan-600 to-teal-600 text-white shadow-lg shadow-cyan-500/20 flex items-center gap-1.5 active:scale-95";
        } else {
          btn.className = "lesson-btn px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all border border-slate-700 bg-slate-800/80 text-slate-300 hover:text-white hover:bg-slate-700 flex items-center gap-1.5 active:scale-95";
        }
      }

      // Cập nhật tiêu đề bài học
      const lessonInfo = lessonData[lessonNum];
      document.getElementById('lesson-badge').innerText = lessonInfo.title;
      document.getElementById('current-lesson-num').innerText = lessonNum;
      document.getElementById('settings-lesson-label').innerText = lessonNum;

      // Load câu hỏi & từ khóa bài đã chọn
      secretKeyword = lessonInfo.keyword;
      bgImageUrl = lessonInfo.bgUrl;

      // Reset ô nhập từ khóa
      document.getElementById('guess-input').value = '';

      // Khởi tạo game
      initGame();
      showToast(`Đã chuyển sang ${lessonInfo.title}`);
    }

    /**
     * KHỞI TẠO VÀ XÁO TRỘN BÀI (FISHER-YATES SHUFFLE)
     */
    function initGame() {
      matchedPairsCount = 0;
      movesCount = 0;
      score = 0;
      flippedCards = [];
      isLocked = false;
      gameEnded = false;

      // Cập nhật thông tin bài học hiện tại & rút ngẫu nhiên 6 câu từ ngân hàng 20 câu
      const lessonInfo = lessonData[currentLesson];
      secretKeyword = lessonInfo.keyword;
      if (lessonInfo.bgUrl) bgImageUrl = lessonInfo.bgUrl;

      // Trộn ngẫu nhiên ngân hàng câu hỏi của bài và lấy 6 cặp cho lượt chơi mới
      const bank = lessonInfo.questions || [];
      let shuffledBank = [...bank];
      for (let i = shuffledBank.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledBank[i], shuffledBank[j]] = [shuffledBank[j], shuffledBank[i]];
      }
      questionsData = shuffledBank.slice(0, 6);

      // Cập nhật ảnh nền
      document.getElementById('atomic-bg').style.backgroundImage = `url('${bgImageUrl}')`;

      // Tạo mảng 12 thẻ (6 thẻ trái, 6 thẻ phải)
      let cardList = [];
      const numPairs = questionsData.length;

      for (let i = 0; i < numPairs; i++) {
        cardList.push({
          id: `left-${i}`,
          pairIndex: i,
          text: questionsData[i].left,
          type: 'left',
          isFlipped: false,
          isMatched: false
        });
        cardList.push({
          id: `right-${i}`,
          pairIndex: i,
          text: questionsData[i].right,
          type: 'right',
          isFlipped: false,
          isMatched: false
        });
      }

      // Xáo trộn ngẫu nhiên 12 thẻ
      for (let i = cardList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cardList[i], cardList[j]] = [cardList[j], cardList[i]];
      }

      // Gán số hiệu thẻ từ 1 đến 12
      cards = cardList.map((card, idx) => ({
        ...card,
        displayNumber: idx + 1
      }));

      // Khởi tạo mảng chữ cái của từ khóa bí mật
      initKeywordSlots();

      // Cập nhật giao diện
      updateUI();
      renderGrid();
    }

    /**
     * TẠO BẢNG Ô CHỮ TỪ KHÓA BÍ MẬT
     */
    function initKeywordSlots() {
      const chars = secretKeyword.split('');
      revealedLetters = chars.map(ch => ch === ' '); // Khoảng trắng mặc định mở
    }

    /**
     * RENDER LƯỚI 12 Ô THẺ BÀI (4x3 GRID)
     */

      const gridContainer = document.getElementById('card-grid');
      gridContainer.innerHTML = '';

      cards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = `relative h-full w-full perspective-1000 cursor-pointer select-none ${card.isMatched ? 'card-matched-hidden' : ''}`;
        cardEl.setAttribute('data-index', index);
        cardEl.onclick = () => handleCardClick(index);

        const innerEl = document.createElement('div');
        innerEl.id = `card-inner-${index}`;
        innerEl.className = `w-full h-full transform-style-3d transition-transform duration-500 rounded-xl relative ${card.isFlipped ? 'rotate-y-180' : ''}`;

        // Mặt Úp (Card Face Front)
        const frontEl = document.createElement('div');
        frontEl.className = 'absolute inset-0 backface-hidden rounded-xl card-front-design flex items-center justify-center transition-all';
        frontEl.innerHTML = `
          <span class="card-number-text text-2xl xs:text-3xl sm:text-4xl md:text-5xl font-extrabold select-none">
            ${card.displayNumber}
          </span>
        `;

        // Mặt Ngửa (Card Back Glassmorphism)
        const backEl = document.createElement('div');
        backEl.id = `card-back-${index}`;
        backEl.className = 'absolute inset-0 backface-hidden rotate-y-180 rounded-xl card-back-glass flex items-center justify-center p-1.5 xs:p-2 sm:p-3 text-center text-[10px] xs:text-xs sm:text-sm md:text-base font-semibold text-slate-100 leading-tight sm:leading-snug overflow-y-auto select-text';
        backEl.innerHTML = `<div class="my-auto w-full">${card.text}</div>`;

        innerEl.appendChild(frontEl);
        innerEl.appendChild(backEl);
        cardEl.appendChild(innerEl);
        gridContainer.appendChild(cardEl);
      });

      // Render biểu thức MathJax
      renderMathJax();
    }

    /**
     * XỬ LÝ SỰ KIỆN CLICK VÀO Ô THẺ BÀI
     */
    function handleCardClick(index) {
      if (isLocked || gameEnded) return;
      const card = cards[index];

      // Nếu thẻ đã mở hoặc đã ghép đúng thì bỏ qua
      if (card.isFlipped || card.isMatched) return;

      // Phát âm thanh lật thẻ
      playSound('flip');

      // Lật thẻ
      card.isFlipped = true;
      flippedCards.push(index);

      const innerEl = document.getElementById(`card-inner-${index}`);
      if (innerEl) innerEl.classList.add('rotate-y-180');

      // Khi đã lật đủ 2 thẻ
      if (flippedCards.length === 2) {
        isLocked = true;
        movesCount++;
        document.getElementById('moves-count').innerText = movesCount;

        const [idx1, idx2] = flippedCards;
        const card1 = cards[idx1];
        const card2 = cards[idx2];

        // KIỂM TRẢ GHÉP ĐÚNG
        if (card1.pairIndex === card2.pairIndex && card1.type !== card2.type) {
          // Lật đúng cặp!
          playSound('match');

          // Hiệu ứng viền xanh chớp nhẹ
          const back1 = document.getElementById(`card-back-${idx1}`);
          const back2 = document.getElementById(`card-back-${idx2}`);
          if (back1) back1.classList.add('animate-success-glow');
          if (back2) back2.classList.add('animate-success-glow');

          setTimeout(() => {
            card1.isMatched = true;
            card2.isMatched = true;

            // Hai thẻ chuyển sang trong suốt để lộ ảnh nền
            const cardEl1 = document.querySelectorAll('#card-grid > div')[idx1];
            const cardEl2 = document.querySelectorAll('#card-grid > div')[idx2];
            if (cardEl1) cardEl1.classList.add('card-matched-hidden');
            if (cardEl2) cardEl2.classList.add('card-matched-hidden');

            matchedPairsCount++;
            score += 100;

            // Reveal 1 chữ cái tương ứng trong từ khóa bí mật
            revealNextKeywordLetter();

            flippedCards = [];
            isLocked = false;
            updateUI();

            // Kiểm tra xem đã thắng hoàn toàn chưa
            if (matchedPairsCount === questionsData.length) {
              triggerVictory(true);
            }
          }, 600);

        } else {
          // LẬT SAI: Rung viền đỏ + âm bíp trầm + Giữ 2.5 giây cho học sinh ghi nhớ
          playSound('wrong');

          const back1 = document.getElementById(`card-back-${idx1}`);
          const back2 = document.getElementById(`card-back-${idx2}`);
          if (back1) back1.classList.add('animate-shake');
          if (back2) back2.classList.add('animate-shake');

          setTimeout(() => {
            card1.isFlipped = false;
            card2.isFlipped = false;

            if (innerEl) innerEl.classList.remove('rotate-y-180');
            const inner1 = document.getElementById(`card-inner-${idx1}`);
            const inner2 = document.getElementById(`card-inner-${idx2}`);
            if (inner1) inner1.classList.remove('rotate-y-180');
            if (inner2) inner2.classList.remove('rotate-y-180');

            if (back1) back1.classList.remove('animate-shake');
            if (back2) back2.classList.remove('animate-shake');

            flippedCards = [];
            isLocked = false;
          }, 2500); // Giữ nguyên đúng 2.5 giây
        }
      }
    }

    /**
     * MỞ MỘT CHỮ CÁI TƯƠNG ỨNG TRONG TỪ KHÓA BÍ MẬT KHI LẬT ĐÚNG 1 CẶP
     */
    function revealNextKeywordLetter() {
      const chars = secretKeyword.split('');
      // Tìm vị trí chữ cái chưa mở đầu tiên (không tính khoảng trắng)
      for (let i = 0; i < chars.length; i++) {
        if (chars[i] !== ' ' && !revealedLetters[i]) {
          revealedLetters[i] = true;
          break;
        }
      }
      renderKeywordSlots();
    }

    /**
     * RENDER THANH HIỂN THỊ TỪ KHÓA BÍ MẬT dạng ô chữ
     */
    function renderKeywordSlots() {
      const container = document.getElementById('keyword-slots');
      container.innerHTML = '';

      const chars = secretKeyword.split('');
      chars.forEach((ch, idx) => {
        if (ch === ' ') {
          // Khoảng trắng giữa các từ
          const spaceEl = document.createElement('div');
          spaceEl.className = 'w-2 xs:w-3 sm:w-6';
          container.appendChild(spaceEl);
        } else {
          const slotEl = document.createElement('div');
          const isRevealed = revealedLetters[idx];

          if (isRevealed) {
            slotEl.className = 'w-6 h-8 xs:w-7 xs:h-9 sm:w-9 sm:h-11 rounded-lg bg-gradient-to-b from-emerald-500 to-teal-700 text-white font-extrabold text-xs xs:text-sm sm:text-lg flex items-center justify-center border border-emerald-300 shadow-[0_0_12px_rgba(16,185,129,0.5)] uppercase transition-all duration-500 transform scale-105';
            slotEl.innerText = ch;
          } else {
            slotEl.className = 'w-6 h-8 xs:w-7 xs:h-9 sm:w-9 sm:h-11 rounded-lg bg-slate-800/90 border border-slate-700 text-slate-500 font-bold text-[10px] xs:text-xs sm:text-sm flex items-center justify-center shadow-inner';
            slotEl.innerText = '?';
          }
          container.appendChild(slotEl);
        }
      });
    }

    /**
     * ĐOÁN Ô CHỮ BÍ MẬT
     */
    function guessKeyword() {
      if (gameEnded) return;

      const inputEl = document.getElementById('guess-input');
      const userGuess = inputEl.value.trim().toLowerCase();

      if (!userGuess) {
        showToast("Vui lòng nhập câu trả lời của bạn!");
        return;
      }

      const targetKeyword = secretKeyword.trim().toLowerCase();

      // Chuẩn hóa so sánh không phân biệt hoa/thường, dấu
      if (userGuess === targetKeyword || userGuess.normalize("NFC") === targetKeyword.normalize("NFC")) {
        // ĐOÁN ĐÚNG!
        showToast("🎉 CHÍNH XÁC! Bạn đã đoán đúng từ khóa bí mật!", "success");
        score += 500;
        triggerVictory(true);
      } else {
        // ĐOÁN SAI
        playSound('wrong');
        showToast("❌ Chưa chính xác! Hãy tiếp tục lật hình để tìm thêm gợi ý.", "error");
        inputEl.classList.add('border-red-500');
        setTimeout(() => inputEl.classList.remove('border-red-500'), 1500);
      }
    }

    /**
     * KÍCH HOẠT CHIẾN THẮNG & HIỆU ỨNG PHÁO HOA
     */
    function triggerVictory(guessCorrect = false) {
      gameEnded = true;

      // 1. Toàn bộ 12 ô ngay lập tức biến mất để lộ hoàn toàn bức ảnh bí ẩn
      cards.forEach(c => {
        c.isMatched = true;
      });
      const cardDivs = document.querySelectorAll('#card-grid > div');
      cardDivs.forEach(div => div.classList.add('card-matched-hidden'));

      // 2. Mở toàn bộ từ khóa
      revealedLetters = secretKeyword.split('').map(() => true);
      renderKeywordSlots();

      // 3. Cập nhật UI
      matchedPairsCount = questionsData.length;
      updateUI();

      // 4. Phát âm thanh chiến thắng
      playSound('victory');

      // 5. Kích hoạt pháo hoa rực rỡ
      startFireworks();

      showToast(`🏆 GIẢI MÃ THÀNH CÔNG TỪ KHÓA BÀI ${currentLesson}: "${secretKeyword}"!`, "success");
    }

    /**
     * CẬP NHẬT GIAO DIỆN CHUNG (PROGRESS BAR, SCORE, KEYWORD)
     */
    function updateUI() {
      const totalPairs = questionsData.length;
      const progressPercent = Math.round((matchedPairsCount / totalPairs) * 100);

      document.getElementById('progress-text').innerText = `${matchedPairsCount} / ${totalPairs} cặp`;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;
      document.getElementById('score-text').innerText = score;

      renderKeywordSlots();
    }

    /**
     * MATHJAX RENDER HELPER
     */
    function renderMathJax() {
      if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
        window.MathJax.typesetPromise().catch(err => console.log('MathJax error:', err));
      }
    }

    /**
     * TOÀN MÀN HÌNH (FULLSCREEN TOGGLE)
     */
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          showToast("Trình duyệt không hỗ trợ chế độ toàn màn hình tự động.");
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    /**
     * BẬT / TẮT ÂM THANH
     */
    function toggleSound() {
      soundEnabled = !soundEnabled;
      const statusEl = document.getElementById('sound-status');
      const iconEl = document.getElementById('sound-icon');

      if (soundEnabled) {
        statusEl.innerText = "BẬT";
        statusEl.className = "text-xs font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400";
        iconEl.innerText = "🔊";
      } else {
        statusEl.innerText = "TẮT";
        statusEl.className = "text-xs font-bold px-2 py-0.5 rounded bg-rose-500/20 text-rose-400";
        iconEl.innerText = "🔇";
      }
    }

    /**
     * QUẢN LÝ SIDE PANEL CÀI ĐẶT
     */
    function openSettings() {
      document.getElementById('settings-backdrop').classList.remove('hidden');
      document.getElementById('settings-panel').classList.remove('translate-x-full');

      // Điền dữ liệu ngân hàng câu hỏi đầy đủ của bài hiện tại vào form cài đặt
      document.getElementById('setting-keyword').value = secretKeyword;
      document.getElementById('setting-bg-url').value = bgImageUrl;
      document.getElementById('setting-json').value = JSON.stringify(lessonData[currentLesson].questions || questionsData, null, 2);
    }

    function closeSettings() {
      document.getElementById('settings-backdrop').classList.add('hidden');
      document.getElementById('settings-panel').classList.add('translate-x-full');
    }

    function saveSettings() {
      const newKeyword = document.getElementById('setting-keyword').value.trim();
      const newBgUrl = document.getElementById('setting-bg-url').value.trim();
      const jsonStr = document.getElementById('setting-json').value.trim();

      if (!newKeyword) {
        showToast("Từ khóa không được để trống!", "error");
        return;
      }

      try {
        const parsedJSON = JSON.parse(jsonStr);
        if (!Array.isArray(parsedJSON) || parsedJSON.length === 0) {
          throw new Error("Mảng JSON phải chứa ít nhất 1 cặp câu hỏi.");
        }

        // Lưu vào bài hiện tại
        lessonData[currentLesson].questions = parsedJSON;
        lessonData[currentLesson].keyword = newKeyword;
        if (newBgUrl) lessonData[currentLesson].bgUrl = newBgUrl;

        questionsData = parsedJSON;
        secretKeyword = newKeyword;
        if (newBgUrl) bgImageUrl = newBgUrl;

        closeSettings();
        initGame();
        showToast(`Cập nhật cài đặt cho Bài ${currentLesson} thành công!`, "success");

      } catch (err) {
        showToast("Lỗi định dạng JSON! Vui lòng kiểm tra lại cấu trúc dữ liệu.", "error");
      }
    }

    function restoreDefaults() {
      lessonData = JSON.parse(JSON.stringify(CHAPTER_LESSONS));
      
      const lessonInfo = lessonData[currentLesson];
      questionsData = lessonInfo.questions;
      secretKeyword = lessonInfo.keyword;
      bgImageUrl = lessonInfo.bgUrl;

      document.getElementById('setting-keyword').value = secretKeyword;
      document.getElementById('setting-bg-url').value = bgImageUrl;
      document.getElementById('setting-json').value = JSON.stringify(questionsData, null, 2);

      closeSettings();
      initGame();
      showToast("Đã khôi phục tất cả bài về mặc định!", "success");
    }

    function restartGame() {
      closeSettings();
      initGame();
      showToast("Đã bắt đầu lượt chơi mới!");
    }

    /**
     * HIỆU ỨNG PHÁO HOA CHÚC MỪNG (FIREWORKS CANVAS)
     */
    function startFireworks() {
      const canvas = document.getElementById('fireworks-canvas');
      canvas.classList.remove('hidden');
      const ctx = canvas.getContext('2d');

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let particles = [];
      const colors = ['#38bdf8', '#4ade80', '#facc15', '#f43f5e', '#a855f7', '#fb923c'];

      function createExplosion(x, y) {
        for (let i = 0; i < 60; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 6 + 2;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1,
            decay: Math.random() * 0.02 + 0.01,
            radius: Math.random() * 3 + 2
          });
        }
      }

      // Tạo nhiều đợt pháo hoa
      createExplosion(canvas.width * 0.3, canvas.height * 0.4);
      setTimeout(() => createExplosion(canvas.width * 0.7, canvas.height * 0.3), 300);
      setTimeout(() => createExplosion(canvas.width * 0.5, canvas.height * 0.5), 600);
      setTimeout(() => createExplosion(canvas.width * 0.2, canvas.height * 0.6), 900);
      setTimeout(() => createExplosion(canvas.width * 0.8, canvas.height * 0.5), 1200);

      let animId;
      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach((p, idx) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.08; // Trọng lực
          p.alpha -= p.decay;

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
          ctx.restore();

          if (p.alpha <= 0) {
            particles.splice(idx, 1);
          }
        });

        if (particles.length > 0) {
          animId = requestAnimationFrame(loop);
        } else {
          canvas.classList.add('hidden');
          cancelAnimationFrame(animId);
        }
      }
      loop();
    }

    /**
     * TOAST NOTIFICATION POPUP
     */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

      let bgClass = "bg-slate-900 border-slate-700 text-white";
      if (type === 'success') bgClass = "bg-emerald-950/90 border-emerald-500/50 text-emerald-200 shadow-emerald-500/20";
      if (type === 'error') bgClass = "bg-rose-950/90 border-rose-500/50 text-rose-200 shadow-rose-500/20";

      toast.className = `px-4 py-2.5 rounded-xl border backdrop-blur-md shadow-xl text-xs sm:text-sm font-semibold transition-all transform translate-y-4 opacity-0 flex items-center gap-2 pointer-events-auto ${bgClass}`;
      toast.innerText = message;

      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Khởi tạo Bài 1 mặc định khi trang tải hoàn tất
    window.onload = () => {
      selectLesson(1);
    };
  </script>
